<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prognosis - Foreknowledge is power.</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --success: #10b981;
            --success-bg: #ecfdf5;
        }

        * {
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .container {
            background: var(--card-bg);
            max-width: 800px;
            width: 100%;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #eff6ff;
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        h1 {
            color: var(--text-main);
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-muted);
            margin-top: 6px;
            font-size: 0.95rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-weight: 600;
            color: #334155;
            font-size: 0.875rem;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.95rem;
            color: var(--text-main);
            background-color: #f8fafc;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            background-color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* --- Dynamic Result Card --- */
        .result-card {
            margin-top: 30px;
            padding: 24px;
            border-radius: 16px;
            display: none;
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-card.high {
            display: block;
            background: var(--danger-bg);
            border: 1px solid #fca5a5;
            color: #991b1b;
        }

        .result-card.low {
            display: block;
            background: var(--success-bg);
            border: 1px solid #6ee7b7;
            color: #065f46;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .result-title {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .risk-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .high .risk-badge { background: #fee2e2; color: #dc2626; }
        .low .risk-badge { background: #d1fae5; color: #059669; }

        /* Dynamic Progress Bar */
        .meter-container {
            width: 100%;
            height: 10px;
            background-color: rgba(0, 0, 0, 0.08);
            border-radius: 10px;
            overflow: hidden;
            margin: 12px 0;
        }

        .meter-fill {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .high .meter-fill { background-color: var(--danger); }
        .low .meter-fill { background-color: var(--success); }

        .error {
            background-color: #fef2f2;
            color: var(--danger);
            border: 1px solid #fca5a5;
            padding: 12px 16px;
            border-radius: 12px;
            margin-top: 20px;
            font-size: 0.9rem;
            text-align: center;
            display: none;
        }

        footer {
            text-align: center;
            margin-top: 28px;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        @media (max-width: 640px) {
            .container { padding: 24px; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="brand-badge">⚡ Prognosis - Foreknowledge is power</span>
            <h1>A Diabetes Risk Predictor</h1>
            <p class="subtitle">Enter patient health metrics to compute real-time risk evaluation</p>
        </div>

        <form id="predictForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="pregnancies">Pregnancies</label>
                    <input type="number" id="pregnancies" name="pregnancies" value="0" min="0" step="1" required />
                </div>
                <div class="form-group">
                    <label for="glucose">Glucose (mg/dL)</label>
                    <input type="number" id="glucose" name="glucose" value="85" min="0" step="1" required />
                </div>
                <div class="form-group">
                    <label for="bloodpressure">Blood Pressure (mm Hg)</label>
                    <input type="number" id="bloodpressure" name="bloodpressure" value="66" min="0" step="1" required />
                </div>
                <div class="form-group">
                    <label for="skinthickness">Skin Thickness (mm)</label>
                    <input type="number" id="skinthickness" name="skinthickness" value="29" min="0" step="1" required />
                </div>
                <div class="form-group">
                    <label for="insulin">Insulin (mu U/ml)</label>
                    <input type="number" id="insulin" name="insulin" value="0" min="0" step="1" required />
                </div>
                <div class="form-group">
                    <label for="bmi">BMI (kg/m²)</label>
                    <input type="number" id="bmi" name="bmi" value="26.6" min="0" step="0.1" required />
                </div>
                <div class="form-group">
                    <label for="dpf">Diabetes Pedigree Function</label>
                    <input type="number" id="dpf" name="dpf" value="0.351" min="0" step="0.001" required />
                </div>
                <div class="form-group">
                    <label for="age">Age (years)</label>
                    <input type="number" id="age" name="age" value="31" min="0" step="1" required />
                </div>
            </div>

            <button type="submit" class="btn">Calculate Risk Score</button>
        </form>

        <!-- Dynamic Results Card -->
        <div id="result" class="result-card">
            <div class="result-header">
                <div class="result-title" id="resultLabel">--</div>
                <span class="risk-badge" id="riskBadge">--</span>
            </div>
            
            <div class="meter-container">
                <div class="meter-fill" id="meterFill"></div>
            </div>

            <div style="font-size: 0.95rem; font-weight: 600;" id="resultProbability"></div>
        </div>

        <div id="error" class="error"></div>

        <footer>
            This AI tool is designed for educational purposes. Always consult a healthcare professional.
        </footer>
    </div>

    <script>
        document.getElementById('predictForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const resultDiv = document.getElementById('result');
            const errorDiv = document.getElementById('error');
            const meterFill = document.getElementById('meterFill');
            
            errorDiv.style.display = 'none';
            resultDiv.className = 'result-card'; 
            meterFill.style.width = '0%';

            const patientData = {
                pregnancies: parseInt(document.getElementById('pregnancies').value),
                glucose: parseFloat(document.getElementById('glucose').value),
                blood_pressure: parseFloat(document.getElementById('bloodpressure').value),
                skin_thickness: parseFloat(document.getElementById('skinthickness').value),
                insulin: parseFloat(document.getElementById('insulin').value),
                bmi: parseFloat(document.getElementById('bmi').value),
                diabetes_pedigree: parseFloat(document.getElementById('dpf').value),
                age: parseInt(document.getElementById('age').value)
            };

            try {
                const response = await fetch('https://prognosisapower.netlify.app/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(patientData)
                });

                const data = await response.json();

                if (!response.ok) {
                    errorDiv.textContent = 'Error: ' + (data.detail || 'Failed to process request.');
                    errorDiv.style.display = 'block';
                    return;
                }

                const probaPercent = (data.risk_probability * 100).toFixed(1);

                // Clear base class and assign high (red) or low (green) cleanly
                if (Number(data.prediction) === 1) {
                    resultDiv.classList.add('high');
                    document.getElementById('riskBadge').textContent = 'High Risk';
                } else {
                    resultDiv.classList.add('low');
                    document.getElementById('riskBadge').textContent = 'Low Risk';
                }

                document.getElementById('resultLabel').textContent = `Result: ${data.label}`;
                document.getElementById('resultProbability').textContent = `Calculated Risk Probability: ${probaPercent}%`;
                
                // Animate meter fill bar
                setTimeout(() => {
                    meterFill.style.width = `${Math.max(probaPercent, 5)}%`;
                }, 100);

            } catch (err) {
                errorDiv.textContent = 'Network error. Please ensure the backend server is active on port 8000.';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
